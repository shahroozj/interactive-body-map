<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interactive Body Map &mdash; minimal example</title>

<!-- 1. the stylesheet -->
<link rel="stylesheet" href="css/body-map.css">

<style>
    /* Nothing here is required. It only proves the point that the figure has
       no background of its own: it sits on whatever is behind it. */
    body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(160deg, #0f172a, #1e3a5f 60%, #0f766e);
        font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        color: #e2e8f0;
    }

    .panel { text-align: center; padding: 40px 20px; }
    h1 { font-weight: 600; font-size: 20px; letter-spacing: .01em; margin: 0 0 4px; }
    p { margin: 0 0 24px; opacity: .7; font-size: 14px; }

    /* Re-colour the diagram to suit the page. */
    .bodymap {
        --bodymap-fill: rgba(226, 232, 240, .22);
        --bodymap-fill-hover: #38bdf8;
        --bodymap-fill-active: #0284c7;
        --bodymap-fill-disabled: rgba(226, 232, 240, .1);
        --bodymap-stroke: rgba(226, 232, 240, .55);
        --bodymap-detail: rgba(226, 232, 240, .5);
        --bodymap-tooltip-bg: #f8fafc;
        --bodymap-tooltip-color: #0f172a;
        max-width: 300px;
    }
</style>
</head>
<body>

<div class="panel">
    <h1>Where does it hurt?</h1>
    <p>Choose a part of the body.</p>

    <!-- 2. the diagram: links live in the attributes, no JavaScript to write -->
    <div data-body-map
         data-part-head="#head"
         data-part-neck="#neck"
         data-part-chest="#chest"
         data-part-abdomen="#abdomen"
         data-part-pelvis="#pelvis"
         data-part-arms="#arms"
         data-part-legs="#legs"
         data-title="Choose a part of the body"></div>
</div>

<!-- 3. the script -->
<script src="js/body-map.min.js"></script>

</body>
</html>
